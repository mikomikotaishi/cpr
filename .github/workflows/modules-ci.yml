name: C++20 Modules CI
on: [push, workflow_dispatch, pull_request]

env:
  # Enable verbose output for CMake and tests
  VERBOSE: 1
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  ubuntu-clang-modules:
    strategy:
      matrix:
        buildType: [Debug, Release]
    runs-on: ubuntu-latest
    steps:
    - name: Update package list
      run: sudo apt update
    - name: Install Dependencies
      run: |
        sudo apt install -y git libssl-dev build-essential libcurl4-openssl-dev libpsl-dev meson libunistring-dev ninja-build wget
        # Install Clang 21+
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21
        sudo apt install -y libc++-21-dev libc++abi-21-dev
      env:
        DEBIAN_FRONTEND: noninteractive
    - name: Install CMake
      run: |
        wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.sh
        sudo sh cmake.sh --prefix=/usr/local --skip-license
        cmake --version
    - name: Checkout
      uses: actions/checkout@v5
    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.buildType }} \
          -DCMAKE_CXX_COMPILER=clang++-21 \
          -DCMAKE_C_COMPILER=clang-21 \
          -DCPR_BUILD_MODULES=ON \
          -DCPR_BUILD_TESTS=ON \
          -DCPR_BUILD_TESTS_SSL=ON \
          -DCPR_FORCE_OPENSSL_BACKEND=ON \
          -DCPR_USE_SYSTEM_CURL=OFF \
          -G Ninja
    - name: Build
      run: cmake --build build --verbose
    - name: Test
      run: ctest --test-dir build --output-on-failure --repeat until-pass:5
    - name: Verify Module Build
      run: |
        # LIBRARY_OUTPUT_PATH places all libraries in build/lib, not build/modules.
        echo "Searching for module library:"
        found=$(find build/lib build/modules -type f \( -name 'libcpr_module*.a' -o -name 'libcpr_module*.so*' \) 2>/dev/null || true)
        if [ -n "$found" ]; then
          echo "$found"
          echo "Module library built successfully"
        else
          echo "Error: Module library not found"
          ls -la build/lib build/modules || true
          exit 1
        fi

  fedora-gcc-modules:
    runs-on: ubuntu-latest
    container: "fedora:latest"
    steps:
    - name: Update package list
      run: dnf update -y
    - name: Install Dependencies
      run: dnf install -y gcc g++ git make openssl-devel libcurl-devel libpsl-devel libunistring-devel meson ninja-build tar wget
    - name: Install CMake
      run: |
        wget -O cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.tar.gz
        mkdir -p /opt/cmake
        tar -xzf cmake.tar.gz --strip-components=1 -C /opt/cmake
        echo /opt/cmake/bin >> "$GITHUB_PATH"
        /opt/cmake/bin/cmake --version
    - name: Checkout
      uses: actions/checkout@v5
    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCPR_BUILD_MODULES=ON \
          -DCPR_BUILD_TESTS=ON \
          -DCPR_BUILD_TESTS_SSL=ON \
          -DCPR_FORCE_OPENSSL_BACKEND=ON \
          -DCPR_USE_SYSTEM_CURL=OFF \
          -G Ninja
    - name: Build
      run: cmake --build build --verbose
    - name: Test
      run: ctest --test-dir build --output-on-failure --repeat until-pass:5
    - name: Verify Module Build
      run: |
        echo "Searching for module build artifacts:"
        find build -name "*cpr_module*" -type f || true
        find build -name "cpr.gcm" -type f || true
        # GCC stores the compiled module interface (BMI) as cpr.gcm rather than
        # a traditional archive when all sources are in FILE_SET CXX_MODULES.
        # Also check build/lib/ in case LIBRARY_OUTPUT_PATH redirected the archive.
        if find build \( -name "*cpr_module*" -o -name "cpr.gcm" \) -type f | grep -q .; then
          echo "Module build artifacts found successfully"
        else
          echo "Error: No module build artifacts found"
          exit 1
        fi

  windows-msvc-modules:
    runs-on: windows-latest
    steps:
    - uses: actions/setup-python@v6
    - name: Install meson
      run: pip install meson
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Checkout
      uses: actions/checkout@v5
    - name: Install dependencies via vcpkg
      run: |
        vcpkg install curl zlib openssl --triplet x64-windows
      shell: pwsh
    - name: Configure
      run: |
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCPR_BUILD_MODULES=ON `
          -DCPR_BUILD_TESTS=ON `
          -DCPR_BUILD_TESTS_SSL=OFF `
          -DCPR_USE_SYSTEM_CURL=ON `
          -G Ninja
      shell: pwsh
    - name: Build
      run: cmake --build build --config Release --verbose
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure --repeat until-pass:5
    - name: Verify Module Build
      run: |
        # LIBRARY_OUTPUT_PATH places all libraries in build/lib, and Ninja is single-config (no Release/ subdir).
        $found = Get-ChildItem -Path build/lib, build/modules -Recurse -File -Filter "cpr_module*.lib" -ErrorAction SilentlyContinue
        if (-not $found) {
          Get-ChildItem -Path build/lib -Force -ErrorAction SilentlyContinue
          throw "Module library not found"
        }
        $found | ForEach-Object { Write-Host $_.FullName }
        Write-Host "Module library built successfully"
      shell: pwsh

  macos-clang-modules:
    runs-on: macos-latest
    # Uses Homebrew LLVM's own libc++ for 'import std' (see Configure).
    # Keep the job non-blocking until it has been confirmed stable on CI.
    continue-on-error: true
    steps:
    - name: Install Dependencies
      run: |
        brew install cmake llvm libpsl ninja
        echo "$(brew --prefix cmake)/bin" >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@v5
    - name: Configure
      run: |
        # Homebrew's clang links the macOS system libc++ by default, and CMake's
        # '-print-file-name' lookup does not find the 'libc++.modules.json' that
        # Homebrew's own libc++ ships. Point CMake at it and link that libc++.
        LLVM_PREFIX="$(brew --prefix llvm)"
        MODULES_JSON="$(find "$LLVM_PREFIX/lib" -name 'libc++.modules.json' -print -quit)"
        if [ -z "$MODULES_JSON" ]; then
          echo "Error: libc++.modules.json not found under $LLVM_PREFIX/lib"
          exit 1
        fi
        echo "Using $MODULES_JSON"
        LIBCXX_LDFLAGS="-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -Wl,-rpath,$LLVM_PREFIX/lib/unwind -lunwind"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STDLIB_MODULES_JSON="$MODULES_JSON" \
          -DCMAKE_EXE_LINKER_FLAGS="$LIBCXX_LDFLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LIBCXX_LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LIBCXX_LDFLAGS" \
          -DCMAKE_CXX_COMPILER=$LLVM_PREFIX/bin/clang++ \
          -DCMAKE_C_COMPILER=$(brew --prefix llvm)/bin/clang \
          -DCPR_BUILD_MODULES=ON \
          -DCPR_BUILD_TESTS=ON \
          -DCPR_BUILD_TESTS_SSL=OFF \
          -DCPR_USE_SYSTEM_LIB_PSL=ON \
          -G Ninja
    - name: Build
      run: cmake --build build --verbose
    - name: Test
      run: ctest --test-dir build --output-on-failure --repeat until-pass:5
    - name: Verify Module Build
      run: |
        # LIBRARY_OUTPUT_PATH places all libraries in build/lib, not build/modules.
        echo "Searching for module library:"
        found=$(find build/lib build/modules -type f \( -name 'libcpr_module*.a' -o -name 'libcpr_module*.dylib' \) 2>/dev/null || true)
        if [ -n "$found" ]; then
          echo "$found"
          echo "Module library built successfully"
        else
          echo "Error: Module library not found"
          ls -la build/lib build/modules || true
          exit 1
        fi
